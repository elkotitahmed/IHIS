{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Add Lab Test</h4>
    <a href="{{ url_for('lab.catalog') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Back to Catalog</a>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card card-shadow">
            <div class="card-header bg-white">
                <h6 class="mb-0"><i class="fas fa-flask text-info me-2"></i>Test Details</h6>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('lab.add_test') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="test_name" class="form-label">Test Name</label>
                        <input type="text" class="form-control" id="test_name" name="test_name"
                               placeholder="e.g. Complete Blood Count" required>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" class="form-control" id="category" name="category"
                               placeholder="e.g. Hematology">
                    </div>

                    <div class="mb-3">
                        <label for="normal_range" class="form-label">Normal Range</label>
                        <input type="text" class="form-control" id="normal_range" name="normal_range"
                               placeholder="e.g. 4.0 - 11.0">
                    </div>

                    <div class="mb-3">
                        <label for="unit" class="form-label">Unit</label>
                        <input type="text" class="form-control" id="unit" name="unit"
                               placeholder="e.g. x10^9/L">
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" class="form-control" id="price" name="price" step="0.01" min="0"
                               placeholder="e.g. 25.00">
                    </div>

                    <button type="submit" class="btn btn-info text-white"><i class="fas fa-save me-1"></i>Add Test</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
