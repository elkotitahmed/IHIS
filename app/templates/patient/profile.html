{% extends "base.html" %}
{% block content %}
<h4 class="mb-4"><i class="fas fa-user-edit text-primary"></i> My Profile</h4>

<div class="row">
    <div class="col-lg-8">
        <div class="card card-shadow">
            <div class="card-body">
                <form method="post" action="{{ url_for('patient.profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="full_name" class="form-control" value="{{ patient.full_name or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ patient.phone or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" name="date_of_birth" class="form-control" value="{{ patient.date_of_birth.strftime('%Y-%m-%d') if patient.date_of_birth else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="">-- Select Gender --</option>
                                {% for g in ['Male', 'Female', 'Other'] %}
                                <option value="{{ g }}" {{ 'selected' if patient.gender == g }}>{{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">{{ patient.address or '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Blood Type</label>
                            <select name="blood_type" class="form-select">
                                <option value="">-- Select Blood Type --</option>
                                {% for bt in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                                <option value="{{ bt }}" {{ 'selected' if patient.blood_type == bt }}>{{ bt }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Emergency Contact</label>
                            <input type="text" name="emergency_contact" class="form-control" value="{{ patient.emergency_contact or '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Allergies</label>
                            <input type="text" name="allergies" class="form-control" value="{{ patient.allergies or '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Chronic Diseases</label>
                            <input type="text" name="chronic_diseases" class="form-control" value="{{ patient.chronic_diseases or '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Vaccination Records</label>
                            <textarea name="vaccination_records" class="form-control" rows="3">{{ patient.vaccination_records or '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
