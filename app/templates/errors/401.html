{% extends "base.html" %}
{% block content %}{% endblock %}
{% block auth_content %}
<div style="max-width:600px;margin:4rem auto;text-align:center;padding:2rem">
    <h1 style="font-size:3rem;color:var(--color-danger);margin-bottom:1rem">401</h1>
    <h2>Unauthorized</h2>
    <p style="color:var(--color-muted);margin:1rem 0">Your session has expired or you are not signed in. Please log in to continue.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Sign In</a>
</div>
{% endblock %}
