{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-shadow text-center">
            <div class="card-body p-5">
                <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                <h4 class="mb-3">Patient Registration</h4>
                <p class="text-muted mb-4">
                    New patients can self-register through the public registration page.
                    After registering, they will be able to log in and book appointments.
                </p>
                <a href="/register" class="btn btn-primary">
                    <i class="fas fa-external-link-alt"></i> Go to Public Registration
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
