{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title"><i class="fas fa-plus-circle" style="color:var(--ihis-primary);margin-right:var(--sp-2)"></i>{{ 'مهمة جديدة' if g.lang == 'ar' else 'New Task' }}</h1>
        <p class="page-subtitle">{{ 'أنشئ مهمة جديدة' if g.lang == 'ar' else 'Create a new task' }}</p>
    </div>
</div>

<div class="card-premium" style="max-width:640px">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label-ihs">{{ t('title') }} <span class="required">*</span></label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label-ihs">{{ 'الوصف' if g.lang == 'ar' else 'Description' }}</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ 'نوع' if g.lang == 'ar' else 'Type' }}</label>
                        <select name="task_type" class="form-select">
                            {% for t in ['GENERAL','LAB','RADIOLOGY','PHARMACY','NURSING','REFERRAL','PHYSIOTHERAPY','DENTISTRY','DOCUMENT_REVIEW','RESULT_VERIFICATION','ADMISSION'] %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ 'القسم' if g.lang == 'ar' else 'Department' }}</label>
                        <input type="text" name="department" class="form-control" placeholder="e.g. Laboratory">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ 'أولوية' if g.lang == 'ar' else 'Priority' }}</label>
                        <select name="priority" class="form-select">
                            {% for p in ['LOW','NORMAL','HIGH','URGENT','CRITICAL'] %}
                            <option value="{{ p }}" {{ 'selected' if p=='NORMAL' }}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ t('patient') }}</label>
                        <select name="patient_id" class="form-select">
                            <option value="">-- None --</option>
                            {% for p in patients %}
                            <option value="{{ p.id }}">{{ p.id }} - {{ p.user.full_name if p.user else '' }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ 'الموعد' if g.lang == 'ar' else 'Due' }}</label>
                        <input type="datetime-local" name="due_at" class="form-control">
                    </div>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ 'تعيين إلى' if g.lang == 'ar' else 'Assign to' }}</label>
                        <select name="assignee_id" class="form-select">
                            <option value="">{{ 'غير معين (قائمة الدور)' if g.lang == 'ar' else 'Unassigned (role queue)' }}</option>
                            {% for u in staff %}
                            <option value="{{ u.id }}">{{ u.full_name }} — {{ u.roles[0].name if u.roles else u.user_type }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label-ihs">{{ 'دور المسؤول' if g.lang == 'ar' else 'Owning role' }}</label>
                        <select name="assigned_role" class="form-select">
                            <option value="">{{ 'أي دور' if g.lang == 'ar' else 'Any' }}</option>
                            {% for r in ['Doctor','Nurse','LabTechnician','Radiologist','RadiologyTechnician','Pharmacist','Physiotherapist','Dentist','Receptionist','Cashier','Admin'] %}
                            <option value="{{ r }}">{{ r }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <button class="btn-ihs btn-ihs-success"><i class="fas fa-check"></i> {{ 'إنشاء مهمة' if g.lang == 'ar' else 'Create Task' }}</button>
        </form>
    </div>
</div>
{% endblock %}
