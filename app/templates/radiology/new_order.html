{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0"><i class="fas fa-plus me-2"></i>New Radiology Order</h3>
    <a href="{{ url_for('radiology.orders') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Back to Orders</a>
</div>

<div class="row">
    <div class="col-lg-6">
        <div class="card card-shadow">
            <div class="card-header bg-white">
                <h5 class="mb-0">Create Radiology Order</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('radiology.new_order') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="patient_id" class="form-label">Patient</label>
                        <select class="form-select" id="patient_id" name="patient_id" required>
                            <option value="" selected disabled>Select a patient...</option>
                            {% if patients %}
                                {% for p in patients %}
                                <option value="{{ p.id }}">{{ p.user.full_name if p.user else 'Patient #' ~ p.id }}</option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="imaging_type_id" class="form-label">Imaging Type</label>
                        <select class="form-select" id="imaging_type_id" name="imaging_type_id" required>
                            <option value="" selected disabled>Select imaging type...</option>
                            {% if imaging %}
                                {% for it in imaging %}
                                <option value="{{ it.id }}">{{ it.name }}{% if it.description %} - {{ it.description }}{% endif %}</option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority</label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="Normal" selected>Normal</option>
                            <option value="Urgent">Urgent</option>
                            <option value="High">High</option>
                            <option value="Routine">Routine</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="4" placeholder="Clinical context or instructions..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-paper-plane me-1"></i>Create Order</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
