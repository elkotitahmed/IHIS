{% extends "base.html" %}
{% block content %}
<h4 class="mb-4"><i class="fas fa-chart-line text-primary"></i> Revenue Report</h4>

<div class="card card-shadow">
    <div class="card-header bg-transparent"><h6 class="mb-0"><i class="fas fa-calendar-week"></i> Collected — last 7 days</h6></div>
    <div class="card-body">
        <table class="table table-hover align-middle">
            <thead><tr><th>Date</th><th class="text-end">Collected</th></tr></thead>
            <tbody>
            {% for d in daily %}
                <tr>
                    <td>{{ d.date.strftime('%A, %Y-%m-%d') }}</td>
                    <td class="text-end">{{ "%.2f"|format(d.total) }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
