name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify app boots (smoke)
        env:
          FLASK_CONFIG: testing
        run: |
          python -c "from app import create_app; app = create_app('testing'); client = app.test_client(); assert client.get('/auth/login').status_code == 200; print('App boots OK')"
