name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        # requirements-dev.txt deliberately excludes the heavy ML stack:
        # the AI services import timm/torch/tensorflow/ultralytics lazily
        # inside request handlers, so the suite passes without downloading
        # ~1.5 GB of model-runtime wheels.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Verify app boots (smoke)
        env:
          FLASK_CONFIG: testing
        run: |
          python -c "from app import create_app; app = create_app('testing'); client = app.test_client(); assert client.get('/auth/login').status_code == 200; print('App boots OK')"