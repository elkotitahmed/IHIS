name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        # requirements-dev.txt deliberately excludes the heavy ML stack:
        # the AI services import timm/torch/tensorflow/ultralytics lazily
        # inside request handlers, so the suite passes without downloading
        # ~1.5 GB of model-runtime wheels.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Verify app boots (smoke)
        env:
          FLASK_CONFIG: testing
        run: |
          python -c "from app import create_app; app = create_app('testing'); client = app.test_client(); assert client.get('/auth/login').status_code == 200; print('App boots OK')"

      - name: Migration chain applies to an empty database (single head)
        run: python scripts/_mig_chain_check.py

      - name: Seed a scratch database and run the role-by-route white-page audit
        # Every (role, GET route) combination must render without a 500, a
        # blank body or a redirect loop, and hot pages must stay inside the
        # SQL query budget. The development profile builds the schema with
        # create_all (the migration chain itself is proven by the step above),
        # so the scratch DB is stamped at head afterwards. The demo seed is
        # CI-only; production uses `seed.py --roles-only`.
        env:
          FLASK_CONFIG: development
          DATABASE_URL: sqlite:///ci_smoke.db
          SECRET_KEY: ci-only-not-a-secret
        run: |
          python seed.py
          flask db stamp head
          python scripts/smoke_all_routes.py
          python scripts/profile_queries.py
