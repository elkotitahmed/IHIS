# iHIS Nginx Reverse Proxy Configuration
# ========================================
# Copy this to /etc/nginx/sites-available/ihis and symlink to sites-enabled/.
# Adapt server_name, SSL paths, and upstream as needed.
#
# Architecture:
#   Internet → HTTPS (nginx) → HTTP (waitress/gunicorn) → Flask (iHIS)

upstream ihis_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limiting zones (Phase 15)
limit_req_zone $binary_remote_addr zone=ihis_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ihis_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ihis_upload:10m rate=2r/s;

server {
    listen 80;
    server_name ihis.example.com;
    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ihis.example.com;

    # --- TLS (replace with real paths) ---
    ssl_certificate     /etc/ssl/certs/ihis.crt;
    ssl_certificate_key /etc/ssl/private/ihis.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Upload limit (matches Flask MAX_CONTENT_LENGTH) ---
    client_max_body_size 32M;

    # --- Timeouts ---
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # --- Health checks (no auth, no rate limit) ---
    location /health/ {
        proxy_pass http://ihis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets (serve directly, skip Flask) ---
    location /static/ {
        alias /path/to/iHIS_Project/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Login rate limit ---
    location /auth/login {
        limit_req zone=ihis_login burst=10 nodelay;
        proxy_pass http://ihis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API rate limit ---
    location /api/ {
        limit_req zone=ihis_api burst=40 nodelay;
        proxy_pass http://ihis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Upload rate limit ---
    location ~ ^/(patient/documents|pharmacy/radiology)/ {
        limit_req zone=ihis_upload burst=5 nodelay;
        proxy_pass http://ihis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Default: proxy all requests ---
    location / {
        proxy_pass http://ihis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Logging ---
    access_log /var/log/nginx/ihis_access.log;
    error_log  /var/log/nginx/ihis_error.log;
}
